name: Setup C++ GN build environment
description: Installs uv, ninja, gn, and LLVM

inputs:
  os:
    required: true
  llvm_version:
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup base environment
      uses: ./cxx-base-setup
      with:
        os: ${{ inputs.os }}
        llvm_version: ${{ inputs.llvm_version }}

    - name: Setup gn
      uses: ./setup-gn

name: "Setup GN"
description: "Builds, installs, and caches GN"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        # https://github.com/astral-sh/uv/tags
        version: 0.11.32
        enable-cache: true

    - name: Initialize MSVC Developer Command Prompt
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

    - name: Check out GN source
      shell: bash
      run: |
        if [ ! -d "gn" ]; then
          git clone https://gn.googlesource.com/gn gn
        fi

    - name: Cache GN build output
      id: cache-gn
      uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
      with:
        path: gn/out
        key: ${{ runner.os }}-gn-${{ hashFiles('gn/build/**', 'gn/tools/**') }}
        restore-keys: |
          ${{ runner.os }}-gn-

    - name: Build GN (Linux / macOS)
      if: steps.cache-gn.outputs.cache-hit != 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        cd gn
        uv run build/gen.py --allow-warning
        ninja -C out gn

    - name: Build GN (Windows)
      if: steps.cache-gn.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: cmd
      run: |
        cd gn
        uv run build/gen.py --allow-warning
        ninja -C out gn.exe

    - name: Setup environment variables
      shell: bash
      run: |
        echo "$GITHUB_WORKSPACE/gn/out" >> $GITHUB_PATH

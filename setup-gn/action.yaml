name: "Setup GN"
description: "Builds, installs, and caches GN"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      with:
        # https://github.com/astral-sh/uv/tags
        version: 0.11.32
        enable-cache: true

    - name: Initialize MSVC Developer Command Prompt
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

    - name: Check out GN source
      shell: bash
      run: |
        SRC_DIR="${{ runner.temp }}/gn-src"
        if [ ! -d "$SRC_DIR" ]; then
          git clone https://gn.googlesource.com/gn "$SRC_DIR"
        fi

    - name: Cache GN binary
      id: cache-gn
      uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
      with:
        path: ${{ runner.temp }}/gn-bin
        key: ${{ runner.os }}-gn-bin-${{ hashFiles(format('{0}/gn-src/build/**', runner.temp), format('{0}/gn-src/tools/**', runner.temp)) }}
        restore-keys: |
          ${{ runner.os }}-gn-bin-

    - name: Build GN (Linux / macOS)
      if: steps.cache-gn.outputs.cache-hit != 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        mkdir -p "${{ runner.temp }}/gn-bin"
        cd "${{ runner.temp }}/gn-src"
        uv run build/gen.py --allow-warning
        ninja -C out gn
        cp out/gn "${{ runner.temp }}/gn-bin/gn"

    - name: Build GN (Windows)
      if: steps.cache-gn.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: cmd
      run: |
        if not exist "${{ runner.temp }}\gn-bin" mkdir "${{ runner.temp }}\gn-bin"
        cd /d "${{ runner.temp }}\gn\src"
        uv run build/gen.py --allow-warning
        ninja -C out gn.exe
        copy out\gn.exe "${{ runner.temp }}\gn-bin\gn.exe"

    - name: Setup environment variables
      shell: bash
      run: |
        echo "${{ runner.temp }}/gn-bin" >> $GITHUB_PATH

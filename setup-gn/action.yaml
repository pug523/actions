name: "Setup GN"
description: "Builds, installs, and caches GN"

runs:
  using: "composite"
  steps:
    - name: Setup python
      uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
      with:
        python-version: '3.14'

    - name: Initialize MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

    - name: Check out GN source
      shell: bash
      run: |
        if [ ! -d "gn" ]; then
          git clone https://gn.googlesource.com/gn gn
        fi

    - name: Cache GN build output
      id: cache-gn
      uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
      with:
        path: gn/out
        key: ${{ runner.os }}-gn-${{ hashFiles('gn/build/**', 'gn/tools/**') }}
        restore-keys: |
          ${{ runner.os }}-gn-

    - name: Build GN
      if: steps.cache-gn.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd gn
        python build/gen.py --allow-warning
        if [ "${{ runner.os }}" = "Windows" ]; then
          ninja -C out gn.exe
        else
          ninja -C out gn
        fi


    - name: Setup environment variables
      shell: bash
      run: |
        echo "$PWD/gn/out" >> $GITHUB_PATH

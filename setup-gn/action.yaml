name: "Setup GN"
description: "Builds, installs, and caches GN"

inputs:
  llvm_version:
    description: "LLVM version used to build GN when the binary cache misses. 20.1.7 has assets on every platform the build matrix names."
    required: false
    default: "20.1.7"
  gn_revision:
    description: "GN revision to build. Accepts a commit SHA, or 'main' to track upstream HEAD. Defaults to a pinned known-good revision so the cache key stays stable."
    required: false
    default: "054c9865a0fe4074122022bfd4458fc08305a1d5"
  allow_stale_cache:
    description: "When the exact revision is not cached, reuse the most recently cached GN binary for this OS instead of rebuilding. Set to 'false' to require an exact revision match."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        # https://github.com/astral-sh/uv/tags
        version: 0.11.32
        enable-cache: true

    # GN's build_config.h does not name MSVC's _M_ARM64, so GN itself is
    # built for x64 and runs under Windows on ARM's x64 emulation. The
    # arm64 toolchain is exported after GN is done, for the build that
    # follows this action.
    - name: Initialize MSVC Developer Command Prompt
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

    # Resolved before touching the cache so a pinned revision needs no clone at all,
    # and so 'main' can be looked up with ls-remote instead of a full clone.
    - name: Resolve GN revision
      id: gn-revision
      shell: bash
      env:
        GN_REVISION: ${{ inputs.gn_revision }}
      run: |
        set -euo pipefail

        if [ "$GN_REVISION" = "main" ]; then
          sha=$(git ls-remote https://gn.googlesource.com/gn refs/heads/main | cut -f1)
        else
          sha="$GN_REVISION"
        fi

        echo "Building GN revision $sha"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    - name: Cache GN binary
      id: cache-gn
      uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
      with:
        path: ${{ runner.temp }}/gn-bin
        key: ${{ runner.os }}-${{ runner.arch }}-gn-${{ steps.gn-revision.outputs.sha }}-bin
        # Falls back to the newest cached GN for this OS and architecture.
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-gn-

    # Decided from the binary on disk rather than the cache-hit output: a
    # restore-keys hit reports cache-hit=false but still provides a binary.
    - name: Check for usable GN binary
      id: check-gn
      shell: bash
      env:
        ALLOW_STALE_CACHE: ${{ inputs.allow_stale_cache }}
      run: |
        set -euo pipefail

        gn_bin="$RUNNER_TEMP/gn-bin/gn"
        if [ "$RUNNER_OS" = "Windows" ]; then
          gn_bin="$RUNNER_TEMP/gn-bin/gn.exe"
        fi

        if [ -f "$gn_bin" ] && "$gn_bin" --version >/dev/null 2>&1; then
          if [ "$ALLOW_STALE_CACHE" = "true" ]; then
            echo "Using cached GN from $gn_bin"
            echo "needs-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Cached GN is present but allow_stale_cache is false; rebuilding." >&2
            rm -rf "$RUNNER_TEMP/gn-bin"
            echo "needs-build=true" >> "$GITHUB_OUTPUT"
          fi
        elif [ -f "$gn_bin" ]; then
          echo "Cached GN at $gn_bin cannot run here; rebuilding." >&2
          rm -rf "$RUNNER_TEMP/gn-bin"
          echo "needs-build=true" >> "$GITHUB_OUTPUT"
        else
          echo "needs-build=true" >> "$GITHUB_OUTPUT"
        fi

    # install-llvm-action exports its toolchain for every later step in
    # the job. A compiler installed only to build GN must not become the
    # caller's compiler, so keep the environment that was in place before
    # the install and put it back once GN is built.
    - name: Save the build toolchain environment
      if: steps.check-gn.outputs.needs-build == 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        echo "SETUP_GN_SAVED_LLVM_PATH=${LLVM_PATH}" >> "$GITHUB_ENV"
        echo "SETUP_GN_SAVED_CC=${CC:-}" >> "$GITHUB_ENV"
        echo "SETUP_GN_SAVED_CXX=${CXX:-}" >> "$GITHUB_ENV"
        echo "SETUP_GN_SAVED_LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
        echo "SETUP_GN_SAVED_DYLD_LIBRARY_PATH=${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

    # A cache miss needs a compiler with C++23's std::expected; the
    # system toolchain on the runners does not always have one. Install
    # the pinned LLVM from the action's own input so setup-gn works on
    # its own, in a workflow that never installs LLVM for its build.
    - name: Install LLVM for GN build
      if: steps.check-gn.outputs.needs-build == 'true' && runner.os != 'Windows'
      uses: pug523/install-llvm-action@576f70b6adba4802f0c2952399669d061cc1b94c
      with:
        version: ${{ inputs.llvm_version }}
        directory: ${{ runner.temp }}/gn-llvm
        env: true

    # Only reached when a build is actually needed. Full clone because gen.py
    # runs `git describe`, which needs the tags.
    - name: Check out GN source
      if: steps.check-gn.outputs.needs-build == 'true'
      shell: bash
      env:
        GN_SHA: ${{ steps.gn-revision.outputs.sha }}
      run: |
        set -euo pipefail

        SRC_DIR="$RUNNER_TEMP/gn-src"

        if [ ! -d "$SRC_DIR/.git" ]; then
          git clone https://gn.googlesource.com/gn "$SRC_DIR"
        fi

        cd "$SRC_DIR"
        git checkout --force "$GN_SHA"

    - name: Build GN (Linux / macOS)
      if: steps.check-gn.outputs.needs-build == 'true' && runner.os != 'Windows'
      shell: bash
      env:
        CXXFLAGS: -stdlib=libc++
        LDFLAGS: -stdlib=libc++
      run: |
        GN_SRC="$RUNNER_TEMP/gn-src"
        GN_BIN="$RUNNER_TEMP/gn-bin"

        mkdir -p "$GN_BIN"

        cd "$GN_SRC"
        # gen.py adds -static-libstdc++ on Linux while CXXFLAGS asks for
        # libc++. The two disagree about operator new and the exception
        # ABI, so GN's link fails with undefined libc++abi symbols. Let
        # clang link libc++ and libc++abi from the toolchain above. The
        # flag is a no-op on macOS, where gen.py adds no such flag.
        # Linking libc++ dynamically also means gn needs those shared
        # libraries at runtime. The install keeps them in both lib/ and
        # the target triple's directory, so record both in gn itself:
        # later steps should not have to inherit a library path just to
        # run a GN command. Use DT_RPATH rather than the default DT_RUNPATH:
        # libc++.so needs libunwind.so, and RUNPATH is not inherited by
        # the dependencies of the binary that carries it.
        if [ "${{ runner.os }}" = "Linux" ]; then
          GN_LIB="$RUNNER_TEMP/gn-llvm/lib"
          GN_TRIPLE="$("$RUNNER_TEMP/gn-llvm/bin/clang" -dumpmachine)"
          export LDFLAGS="$LDFLAGS -Wl,--disable-new-dtags -Wl,-rpath,$GN_LIB -Wl,-rpath,$GN_LIB/$GN_TRIPLE"
        fi
        uv run build/gen.py --allow-warning --no-static-libstdc++
        ninja -C out gn

        cp out/gn "$GN_BIN/gn"

    - name: Restore the build toolchain environment
      if: steps.check-gn.outputs.needs-build == 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        # Put back only what the caller had. A workflow that calls this
        # action on its own has no toolchain of its own: the LLVM used to
        # build GN is also the one later steps need, and the gn binary
        # itself loads its shared libraries from it.
        if [ -n "$SETUP_GN_SAVED_LLVM_PATH" ]; then
          echo "LLVM_PATH=${SETUP_GN_SAVED_LLVM_PATH}" >> "$GITHUB_ENV"
        fi
        if [ -n "$SETUP_GN_SAVED_CC" ]; then
          echo "CC=${SETUP_GN_SAVED_CC}" >> "$GITHUB_ENV"
        fi
        if [ -n "$SETUP_GN_SAVED_CXX" ]; then
          echo "CXX=${SETUP_GN_SAVED_CXX}" >> "$GITHUB_ENV"
        fi
        if [ -n "$SETUP_GN_SAVED_LD_LIBRARY_PATH" ]; then
          echo "LD_LIBRARY_PATH=${SETUP_GN_SAVED_LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
        fi
        if [ -n "$SETUP_GN_SAVED_DYLD_LIBRARY_PATH" ]; then
          echo "DYLD_LIBRARY_PATH=${SETUP_GN_SAVED_DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
        fi
        # GITHUB_PATH is applied after GITHUB_ENV. Only when the caller
        # had a toolchain does its bin belong ahead of GN's on PATH.
        if [ -n "$SETUP_GN_SAVED_LLVM_PATH" ] && [ -f "$GITHUB_PATH" ]; then
          grep -v 'gn-llvm/bin' "$GITHUB_PATH" > "$GITHUB_PATH.restore" || true
          mv "$GITHUB_PATH.restore" "$GITHUB_PATH"
          echo "${SETUP_GN_SAVED_LLVM_PATH}/bin" >> "$GITHUB_PATH"
        fi

    - name: Build GN (Windows)
      if: steps.check-gn.outputs.needs-build == 'true' && runner.os == 'Windows'
      shell: cmd
      run: |
        if not exist "%RUNNER_TEMP%\gn-bin" mkdir "%RUNNER_TEMP%\gn-bin"

        cd /d "%RUNNER_TEMP%\gn-src"
        uv run build/gen.py --allow-warning
        ninja -C out gn.exe

        copy /Y "out\gn.exe" "%RUNNER_TEMP%\gn-bin\gn.exe"

    - name: Setup environment variables
      shell: bash
      run: |
        echo "$RUNNER_TEMP/gn-bin" >> "$GITHUB_PATH"

    - name: Export the arm64 MSVC environment for the build
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: amd64_arm64
